<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" fill="none" role="img" aria-label="Box list screen placeholder (kraft)">
  <defs>
    <linearGradient id="bezel-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7e2d8"/>
      <stop offset="1" stop-color="#c8c2b4"/>
    </linearGradient>
    <linearGradient id="screen-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf8f4"/>
      <stop offset="1" stop-color="#f1ece2"/>
    </linearGradient>
    <linearGradient id="accent-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#e8884a"/>
    </linearGradient>
    <linearGradient id="box-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2cf"/>
      <stop offset="1" stop-color="#e4d3b8"/>
    </linearGradient>
    <linearGradient id="box-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e6dc"/>
      <stop offset="1" stop-color="#dcd8c9"/>
    </linearGradient>
    <linearGradient id="box-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e6d0"/>
      <stop offset="1" stop-color="#e6d6b6"/>
    </linearGradient>
    <linearGradient id="box-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe3d6"/>
      <stop offset="1" stop-color="#ddd2bd"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="320" height="680" rx="44" fill="url(#bezel-b)"/>
  <rect x="3" y="3" width="314" height="674" rx="41" fill="none" stroke="rgba(60,50,40,0.10)"/>
  <rect x="10" y="10" width="300" height="660" rx="36" fill="url(#screen-b)"/>

  <rect x="130" y="22" width="60" height="20" rx="10" fill="#000"/>
  <text x="32" y="36" fill="#2e2a25" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">9:41</text>
  <rect x="290" y="26" width="18" height="10" rx="2.5" stroke="#2e2a25" stroke-width="0.8" fill="none"/>
  <rect x="292" y="28" width="14" height="6" rx="1" fill="#2e2a25"/>

  <!-- Header -->
  <text x="28" y="92" fill="#2e2a25" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5">ボックス</text>
  <text x="28" y="112" fill="#8a8073" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">5 ボックス</text>
  <!-- Add button -->
  <circle cx="282" cy="92" r="16" fill="url(#accent-b)"/>
  <line x1="276" y1="92" x2="288" y2="92" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="282" y1="86" x2="282" y2="98" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Box cards -->
  <g transform="translate(24,140)">
    <rect width="272" height="84" rx="16" fill="#fdfbf6" stroke="rgba(60,50,40,0.08)" stroke-width="0.5"/>
    <rect x="12" y="12" width="60" height="60" rx="12" fill="url(#box-a)"/>
    <circle cx="42" cy="42" r="14" fill="rgba(255,255,255,0.55)"/>
    <text x="86" y="38" fill="#2e2a25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">フィギュア棚</text>
    <text x="86" y="56" fill="#8a8073" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">18 アイテム</text>
    <circle cx="252" cy="42" r="2" fill="#8a8073"/>
    <circle cx="246" cy="42" r="2" fill="#8a8073"/>
    <circle cx="258" cy="42" r="2" fill="#8a8073"/>
  </g>

  <g transform="translate(24,236)">
    <rect width="272" height="84" rx="16" fill="#fdfbf6" stroke="rgba(60,50,40,0.08)" stroke-width="0.5"/>
    <rect x="12" y="12" width="60" height="60" rx="12" fill="url(#box-b)"/>
    <rect x="28" y="28" width="28" height="28" rx="4" fill="rgba(255,255,255,0.55)"/>
    <text x="86" y="38" fill="#2e2a25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">書籍コレクション</text>
    <text x="86" y="56" fill="#8a8073" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">14 アイテム</text>
  </g>

  <g transform="translate(24,332)">
    <rect width="272" height="84" rx="16" fill="#fdfbf6" stroke="rgba(60,50,40,0.08)" stroke-width="0.5"/>
    <rect x="12" y="12" width="60" height="60" rx="12" fill="url(#box-c)"/>
    <circle cx="42" cy="42" r="16" fill="rgba(255,255,255,0.55)"/>
    <text x="86" y="38" fill="#2e2a25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">レトロゲーム</text>
    <text x="86" y="56" fill="#8a8073" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">9 アイテム</text>
    <!-- Sale badge -->
    <rect x="86" y="60" width="40" height="14" rx="7" fill="rgba(255,107,53,0.12)" stroke="#ff6b35" stroke-width="0.6"/>
    <text x="106" y="70" text-anchor="middle" fill="#d8551f" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">販売中 2</text>
  </g>

  <g transform="translate(24,428)">
    <rect width="272" height="84" rx="16" fill="#fdfbf6" stroke="rgba(60,50,40,0.08)" stroke-width="0.5"/>
    <rect x="12" y="12" width="60" height="60" rx="12" fill="url(#box-d)"/>
    <rect x="24" y="26" width="32" height="20" rx="3" fill="rgba(255,255,255,0.55)"/>
    <rect x="24" y="50" width="32" height="6" rx="2" fill="rgba(255,255,255,0.55)"/>
    <text x="86" y="38" fill="#2e2a25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">雑貨</text>
    <text x="86" y="56" fill="#8a8073" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">7 アイテム</text>
  </g>

  <g transform="translate(24,524)">
    <rect width="272" height="84" rx="16" fill="#fdfbf6" stroke="rgba(60,50,40,0.08)" stroke-width="0.5"/>
    <rect x="12" y="12" width="60" height="60" rx="12" fill="url(#box-a)" opacity="0.7"/>
    <text x="86" y="38" fill="#2e2a25" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">ぬいぐるみ</text>
    <text x="86" y="56" fill="#8a8073" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">未分類</text>
  </g>

  <!-- Bottom tab -->
  <rect x="10" y="620" width="300" height="50" fill="rgba(250,248,244,0.92)"/>
  <line x1="10" y1="620" x2="310" y2="620" stroke="rgba(46,42,37,0.08)" stroke-width="0.5"/>
  <g transform="translate(56,640)" fill="#8a8073">
    <rect x="-7" y="-7" width="14" height="14" rx="3" stroke="#8a8073" stroke-width="1.2" fill="none"/>
  </g>
  <g transform="translate(126,640)">
    <rect x="-8" y="-6" width="16" height="12" rx="2" fill="url(#accent-b)"/>
  </g>
  <g transform="translate(196,640)">
    <circle r="11" fill="rgba(255,107,53,0.10)"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#8a8073" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#8a8073" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(266,640)">
    <circle cx="-1" cy="-1" r="5" stroke="#8a8073" stroke-width="1.2" fill="none"/>
    <line x1="3" y1="3" x2="6" y2="6" stroke="#8a8073" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
